# Settings for the Lithuanian load backtest. The same data and seed give the same results.

seed: 42

data:
  # Where hourly load and the TSO day-ahead forecast come from (energy-data-pipeline):
  #   csv       csv_path: an hourly CSV (ts_hour, load_mw, tso_forecast_mw; UTC), such as
  #             the committed sample, or the pipeline's data/observations/<zone> folder
  #   postgres  the pipeline's mart_hourly table; the URL is read from the environment
  #             variable named in database_url_env (never put it in this file)
  source: csv
  csv_path: data/lt_hourly.csv.gz
  database_url_env: DATABASE_URL
  zone: LT
  timezone: Europe/Vilnius   # hour, weekday and holidays use local time
  country: LT                # public holidays (python-holidays)
  start: "2025-01-01"        # first day used

# Forecast horizon in hours. Features only use load at least this many hours old.
# The TSO publishes its day-ahead forecast in the morning before the delivery day, when
# actual load for the last hours of that day is up to about 40 hours away. 48 hours keeps
# the model's information no better than the TSO's, so the comparison is fair.
horizon_hours: 48

backtest:
  n_splits: 12               # rolling-origin folds: about the last 11 months
  test_days: 28              # length of each test window

xgboost:
  n_estimators: 400
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.9
  colsample_bytree: 0.9
